name: Chromatic

on:
  push:
    branches:
      - main
    paths:
      - "packages/ui/**/*.stories.tsx"
      - "packages/ui/src/**/web/**"
      - "apps/ui-storybook/**"
  pull_request:
    paths:
      - "packages/ui/**/*.stories.tsx"
      - "packages/ui/src/**/web/**"
      - "apps/ui-storybook/**"

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run Chromatic
        working-directory: apps/ui-storybook
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: pnpm exec chromatic --storybook-build-dir=dist
