schema: spec-driven

context: |
  Language: Russian
  All OpenSpec artifacts (proposal, specs, design, tasks) must be written in Russian.

  Domain: messenger monorepo, early stage. UI foundation is in place; packages/core has no modules yet.
  Planning approach: delta-first — document only what a change touches, do not backfill the whole codebase.

  ## Monorepo layout
  - packages/ui — cross-platform UI (ThemeProvider / components / shared)
  - packages/core — business logic, Zustand stores, TanStack Query (modules/{domain}/ + shared/)
  - apps/web — Vite 7 + TanStack Router + React 19 (src/app, src/modules, src/shared)
  - apps/mobile — Expo 54 + React Native 0.81 + React Navigation (src/app, src/modules, src/shared)
  - apps/ui-storybook — Storybook 10.6.0, визуальный каталог web-компонентов @ui
  - Tooling: pnpm workspaces + Turborepo, Node >= 22.21.1, pnpm >= 10

  ## Package boundaries (strict)
  - ui, core → web, mobile, ui-storybook (apps consume packages; packages never import apps)
  - No imports between apps/web and apps/mobile
  - No imports between packages/core and packages/ui
  - Public API: import { Button } from "@ui"; import { ... } from "@core/modules/{domain}" or "@core/shared"
  - Internal imports within a package/app: @/ alias (@/modules, @/shared, @/app)

  ## packages/ui
  - Component folder: types.ts, tokens.ts, web/, mobile/
  - Styling only here: Vanilla Extract (.css.ts) for web, StyleSheet (.styles.ts) for mobile
  - Hierarchy: ThemeProvider → components → shared (downward only); sibling imports within components/ and shared/ allowed, cycles forbidden
  - Shared tokens, sprinkles, themes in src/shared/
  - Existing components: DrawerLayout, Flex, Page, ThemeSwitcher, Typography (components/); ThemeProvider (app shell)

  ## packages/core
  - Structure: modules/{domain}/ (api, types, hooks, utils + optional store, selectors, contexts) + shared/
  - Subpath exports: @core/modules/*, @core/shared — no root @core barrel
  - Currently empty — new modules follow this layout from the start

  ## apps/web, apps/mobile
  - src/app — bootstrap, routes (web), navigation (mobile), layouts
  - src/modules — feature modules (same folder principle as @core + components/)
  - src/shared — types, hooks, utils
  - Dependency graph: app → modules → shared

  ## Code conventions
  - Prefer const arrow functions; named exports; named event handlers (or useCallback)
  - Exception: function declarations for TanStack Router file-based routes (hoisting)
  - File naming: camelCase.ts modules, PascalCase.tsx components, {Component}.css.ts / {Component}.styles.ts
  - One file per hook (hooks/) or util (utils/); colocated constants.ts / types.ts when shared in a folder
  - Testing: describe/test.describe in English; it/test descriptions in Russian — see .cursor/rules/testing.mdc

  ## Verification commands (root)
  - pnpm lint — Biome check across packages (lint + format)
  - pnpm typecheck — TypeScript project references
  - pnpm test — unit-тесты через Vitest (Turbo: @core, @ui, web)
  - pnpm test:e2e — e2e-тесты Playwright для web
  - pnpm format — Biome auto-fix (format + lint + organize imports)
  - pnpm build — full build via Turbo
  - pnpm storybook — dev Storybook (@ui web components)
  - pnpm build-storybook — static Storybook build to apps/ui-storybook/dist
  - pnpm chromatic — visual regression: build Storybook + upload to Chromatic (requires CHROMATIC_PROJECT_TOKEN)
  - CI: .github/workflows/chromatic.yml — Chromatic on PR and push to main (paths filter on @ui stories and ui-storybook)
  - Pre-commit runs: build, lint, typecheck, syncpack:list

  ## Spec organization
  - Domains under openspec/specs/ by feature area (e.g. app-shell)
  - Cross-platform changes: explicitly state web, mobile, or both in specs and design
  - Deep architecture/styling/testing rules: .cursor/rules/

rules:
  proposal:
    - "Always include Why, What Changes, Capabilities, Impact, and Non-goals sections"
    - "Capabilities: use kebab-case paths under specs/ (e.g. app-shell, auth/session)"
    - "Impact must list affected packages/apps with concrete paths, not vague UI changes"
    - "Keep proposals under 500 words unless the change is genuinely large"
  specs:
    - "Use delta format: ADDED / MODIFIED / REMOVED Requirements"
    - "Each requirement needs at least one Scenario with WHEN / THEN / AND bullets"
    - "UI requirements: reference existing patterns in packages/ui before inventing new ones"
    - "Cross-platform: tag scenarios or requirements with platform scope when behavior differs"
  design:
    - "Include Context, Goals, Non-Goals, and Decisions sections"
    - "Every decision must state which package owns the change (ui, core, web, mobile)"
    - "For UI work: note web (.css.ts) and mobile (.styles.ts) impact separately"
    - "Skip design.md only when the change is trivial and has no architectural tradeoffs"
  tasks:
    - "Group tasks by package (ui, core, web, mobile)"
    - "Every task ends with verify: (command, test, or observable behavior)"
    - "Prefer verify: pnpm lint && pnpm typecheck when no tests exist yet"
    - "Cross-platform UI: include tasks for both web/ and mobile/ implementations"
    - "Keep individual tasks small enough for one focused session (~2 hours max)"

operations:
  apply:
    guidance:
      - "Run pnpm lint and pnpm typecheck for touched packages before marking tasks done"
      - "UI changes in packages/ui require both web and mobile implementations unless spec says otherwise"
      - "Follow .cursor/rules/ — do not introduce styling outside packages/ui"
      - "Minimize scope: match the approved artifacts, do not expand beyond tasks.md"
  archive:
    guidance:
      - "Summarize what changed in Russian before archiving"
      - "Note which main specs under openspec/specs/ were updated by the merge"
